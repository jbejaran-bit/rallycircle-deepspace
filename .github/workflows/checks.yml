name: Validate RallyCircle
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: npm 11
        run: npm install -g npm@11
      - name: Install dependencies
        run: npm ci
      - name: Type-check and unit checks
        run: npm run validate
      - name: Lint
        run: npm run lint
      - name: RallyCircle business logic
        run: node --experimental-strip-types --test tests/rally.test.mjs
